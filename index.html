<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b14">
  <title>SandTilt</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- Layar game + tombol sentuh.
         .portrait (HP tegak): game di atas, dua klaster tombol di bawah.
         .landscape (HP miring): klaster kiri | game | klaster kanan.
         Tanpa .has-pad (desktop + keyboard) hanya layar yang tampil. -->
    <div id="console" class="console landscape">
      <section class="area-screen">
          <div id="slot" class="slot">
            <canvas id="screen" aria-label="SandTilt — tetris pasir"></canvas>
          </div>
      </section>

      <!-- Jempol kiri: bahu L (miring kiri) + D-pad (▲ jatuh instan, ◀ ▶ geser, ▼ turun pelan) -->
      <section class="pad pad-left" aria-label="Kontrol kiri">
        <button class="shoulder" data-btn="l" aria-label="Miring kiri (tahan)"><b>L</b><span>MIRING</span></button>
        <div class="dpad" role="group" aria-label="Arah">
          <button class="d d-up" data-btn="up" aria-label="Jatuh instan"><span class="dl">JATUH</span></button>
          <button class="d d-left" data-btn="left" aria-label="Geser kiri"></button>
          <span class="d d-mid"></span>
          <button class="d d-right" data-btn="right" aria-label="Geser kanan"></button>
          <button class="d d-down" data-btn="down" aria-label="Turun pelan"><span class="dl">TURUN</span></button>
        </div>
      </section>

      <!-- Jempol kanan: bahu R (miring kanan) + A putar / B putar balik -->
      <section class="pad pad-right" aria-label="Kontrol kanan">
        <button class="shoulder" data-btn="r" aria-label="Miring kanan (tahan)"><span>MIRING</span><b>R</b></button>
        <div class="ab">
          <div class="ab-btn ab-b"><button class="round" data-btn="b" aria-label="Putar balik">B</button><span>BALIK</span></div>
          <div class="ab-btn ab-a"><button class="round" data-btn="a" aria-label="Putar">A</button><span>PUTAR</span></div>
        </div>
      </section>

      <!-- Satu tombol MENU: jeda, suara, tema, keluar -->
      <section class="pad-mid">
        <div class="sys-btn"><button class="pill" data-btn="menu" aria-label="Menu (jeda & pengaturan)"></button><span>MENU</span></div>
      </section>
    </div>
  </main>


  <!-- Modal nama pemain: menutupi seluruh layar (termasuk tombol sentuh) -->
  <div id="namebox" class="overlay modal" role="dialog" aria-modal="true" aria-labelledby="nametitle">
    <form id="nameform" class="panel" autocomplete="off">
      <h2 id="nametitle">NAMA PEMAIN</h2>
      <p>Nama ini tampil di papan peringkat.</p>
      <input id="nameinput" maxlength="16" spellcheck="false" autocapitalize="characters" enterkeyhint="done" placeholder="2-16 karakter">
      <p id="nameerr" class="err"></p>
      <div class="btns">
        <button type="submit">SIMPAN</button>
        <button type="button" id="nameskip">LEWATI</button>
      </div>
    </form>
  </div>
  <!-- sandtilt.js = gabungan semua file js/ (skrip biasa, bukan module) supaya game juga jalan
       saat index.html dibuka dengan klik ganda (file://). Setelah mengubah js/, jalankan:
       node tools/build-bundle.mjs -->
  <script src="sandtilt.js" defer></script>
</body>
</html>
