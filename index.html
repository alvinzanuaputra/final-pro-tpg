<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#14121f">
  <title>SandTilt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div class="stage">
      <canvas id="screen" aria-label="SandTilt — tetris pasir"></canvas>

      <div id="namebox" class="overlay">
        <form id="nameform" class="panel" autocomplete="off">
          <h2>NAMA PEMAIN</h2>
          <p>Nama ini tampil di papan peringkat.</p>
          <input id="nameinput" maxlength="16" spellcheck="false" autocapitalize="characters" placeholder="2-16 karakter">
          <p id="nameerr" class="err"></p>
          <div class="btns">
            <button type="submit">SIMPAN</button>
            <button type="button" id="nameskip">LEWATI</button>
          </div>
        </form>
      </div>
    </div>

    <div id="touch" class="touch">
      <div class="row">
        <button data-action="tiltL">MIRING<br>KIRI</button>
        <button data-action="rotCW">PUTAR</button>
        <button data-action="tiltR">MIRING<br>KANAN</button>
        <button data-ui="pause" class="small">II</button>
      </div>
      <div class="row">
        <button data-action="left">&#9664;</button>
        <button data-action="soft">&#9660;</button>
        <button data-action="right">&#9654;</button>
        <button data-action="hardDrop">JATUH</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
